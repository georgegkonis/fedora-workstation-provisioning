---
# Mappings merge recursively; lists replace earlier layers.
features:
  desktop: true
  development: true
  work: false
  personal: true
  virtualization: false
preferences:
  shell: bash
  terminal: ptyxis
  editor: vscode
  browser: firefox
  container_engine: podman
development:
  dotnet:
  - '8.0'
  - '10.0'
  java: []
  node:
  - '22'
  python:
  - system
  containers: true
  terraform: true
  powershell: true
  typst: true
  git_credential_manager: true
  anaconda: false
  ai_clis:
  - antigravity
  - claude-code
  - codex
apps:
  vicinae:
    name: Vicinae
    enabled: true
    feature: desktop
    installer: rpm
    rpm:
      packages:
      - vicinae
    integration: vicinae
  onepassword:
    name: 1Password
    enabled: true
    feature: desktop
    installer: rpm
    rpm:
      packages:
      - 1password
      - 1password-cli
    integration: onepassword
    autostart:
      enabled: true
      name: 1password
      command: /opt/1Password/1password --silent
      try_exec: /opt/1Password/1password
  vscode:
    name: Visual Studio Code
    enabled: true
    feature: desktop
    installer: rpm
    rpm:
      packages:
      - code
  jetbrains:
    name: JetBrains Toolbox
    enabled: true
    feature: development
    requires:
      features:
      - desktop
    installer: vendor
    vendor:
      task: jetbrains
    autostart:
      enabled: true
      name: jetbrains-toolbox
      command: sh -c '"$HOME/.local/bin/jetbrains-toolbox/bin/jetbrains-toolbox" --minimize'
  ferdium:
    name: Ferdium
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: org.ferdium.Ferdium
  spotify:
    name: Spotify
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: com.spotify.Client
  extension_manager:
    name: Extension Manager
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: com.mattjakeman.ExtensionManager
  flatseal:
    name: Flatseal
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: com.github.tchx84.Flatseal
  mission_center:
    name: Mission Center
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: io.missioncenter.MissionCenter
  localsend:
    name: LocalSend
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: org.localsend.localsend_app
      background: true
    autostart:
      enabled: true
  gear_lever:
    name: Gear Lever
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: it.mijorus.gearlever
  protonvpn:
    name: Proton VPN
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: com.protonvpn.www
  bazaar:
    name: Bazaar
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: io.github.kolunmi.Bazaar
  list:
    name: List
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: io.github.mrvladus.List
  solaar:
    name: Solaar
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: io.github.pwr_solaar.solaar
  metadata_cleaner:
    name: Metadata Cleaner
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: io.gitlab.metadatacleaner.metadatacleaner
  obsidian:
    name: Obsidian
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: md.obsidian.Obsidian
  galaxy_buds:
    name: Galaxy Buds Client
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: me.timschneeberger.GalaxyBudsClient
  vlc:
    name: VLC
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: org.videolan.VLC
  speedtest:
    name: Speedtest
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: xyz.ketok.Speedtest
  zap:
    name: OWASP ZAP
    enabled: true
    feature: development
    installer: flatpak
    flatpak:
      id: org.zaproxy.ZAP
  postman:
    name: Postman
    enabled: true
    feature: development
    installer: flatpak
    flatpak:
      id: com.getpostman.Postman
  sshpilot:
    name: SSH Pilot
    enabled: true
    feature: development
    installer: flatpak
    flatpak:
      id: io.github.mfat.sshpilot
  podman_desktop:
    name: Podman Desktop
    enabled: true
    feature: development
    installer: flatpak
    flatpak:
      id: io.podman_desktop.PodmanDesktop
    requires:
      features:
      - desktop
      development:
      - containers
      container_engine: podman
    autostart:
      enabled: true
  pods:
    name: Pods
    enabled: true
    feature: development
    installer: flatpak
    flatpak:
      id: com.github.marhkb.Pods
    requires:
      features:
      - desktop
      development:
      - containers
      container_engine: podman
  teams:
    name: Teams for Linux
    enabled: true
    feature: work
    installer: flatpak
    flatpak:
      id: com.github.IsmaelMartinez.teams_for_linux
      background: true
      own_names:
      - org.freedesktop.StatusNotifierItem-2-1
    autostart:
      enabled: true
  steam:
    name: Steam
    enabled: true
    feature: personal
    installer: flatpak
    flatpak:
      id: com.valvesoftware.Steam
      background: true
  qbittorrent:
    name: qBittorrent
    enabled: true
    feature: personal
    installer: flatpak
    flatpak:
      id: org.qbittorrent.qBittorrent
  zotero:
    name: Zotero
    enabled: true
    feature: personal
    installer: flatpak
    flatpak:
      id: org.zotero.Zotero
  gimp:
    name: GIMP
    enabled: true
    feature: personal
    installer: flatpak
    flatpak:
      id: org.gimp.GIMP
  firefox:
    name: Firefox
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: org.mozilla.firefox
    requires:
      browser: firefox
  chrome:
    name: Google Chrome
    enabled: true
    feature: desktop
    installer: flatpak
    flatpak:
      id: com.google.Chrome
    requires:
      browser: chrome
  azure_cli:
    name: Azure CLI
    enabled: true
    feature: work
    installer: rpm
    rpm:
      packages:
      - azure-cli
  gnome_tweaks:
    name: GNOME Tweaks
    enabled: true
    feature: desktop
    installer: rpm
    rpm:
      packages:
      - gnome-tweaks
  neovim:
    name: Neovim
    enabled: true
    feature: desktop
    installer: rpm
    rpm:
      packages:
      - neovim
  ptyxis:
    name: Ptyxis
    enabled: true
    feature: desktop
    installer: rpm
    rpm:
      packages:
      - ptyxis
    requires:
      terminal: ptyxis
  gnome_terminal:
    name: GNOME Terminal
    enabled: true
    feature: desktop
    installer: rpm
    rpm:
      packages:
      - gnome-terminal
    requires:
      terminal: gnome-terminal
git:
  name: ''
  email: ''
  work_name: ''
  work_email: ''
  signing_key: ''
  work_signing_key: ''
packages:
  base:
  - git
  - curl
  - fastfetch
  - tree
  - zip
  - unzip
  - rclone
  - tmux
  - jq
  - bat
  - ripgrep
  - just
  desktop: []
  development:
  - make
  - gcc
  - gcc-c++
  - autoconf
  - automake
  - ccache
  - cscope
  - ctags
  - gdb
  - meson
  - ninja-build
  - strace
  - valgrind
  - python3-ansible-lint
  - gh
  - git-subtree
  work: []
  personal: []
  virtualization:
  - qemu-kvm
  - libvirt
  - virt-manager
flatpak:
  remotes:
  - name: flathub
    url: https://dl.flathub.org/repo/flathub.flatpakrepo
gnome:
  system_extensions:
  - package: gnome-shell-extension-apps-menu
    uuid: apps-menu@gnome-shell-extensions.gcampax.github.com
  - package: gnome-shell-extension-launch-new-instance
    uuid: launch-new-instance@gnome-shell-extensions.gcampax.github.com
  - package: gnome-shell-extension-places-menu
    uuid: places-menu@gnome-shell-extensions.gcampax.github.com
  - package: gnome-shell-extension-window-list
    uuid: window-list@gnome-shell-extensions.gcampax.github.com
  - package: gnome-shell-extension-background-logo
    uuid: background-logo@fedorahosted.org
  user_extensions:
  - appindicatorsupport@rgcjonas.gmail.com
  - blur-my-shell@aunetx
  - caffeine@patapon.info
  - clipboard-indicator@tudmotu.com
  - dash-to-dock@micxgx.gmail.com
  - tilingshell@ferrarodomenico.com
  - rounded-window-corners@fxgn
  - weatheroclock@CleoMenezesJr.github.io
  - dynamic-music-pill@andbal
  - wack-lockscreen-clock@rinzler69-wastaken.github.com
  enabled_extensions:
  - appindicatorsupport@rgcjonas.gmail.com
  - blur-my-shell@aunetx
  - caffeine@patapon.info
  - clipboard-indicator@tudmotu.com
  - dash-to-dock@micxgx.gmail.com
  - dynamic-music-pill@andbal
  - launch-new-instance@gnome-shell-extensions.gcampax.github.com
  - rounded-window-corners@fxgn
  - tilingshell@ferrarodomenico.com
  - wack-lockscreen-clock@rinzler69-wastaken.github.com
  - weatheroclock@CleoMenezesJr.github.io
  autostart:
  - name: ckb-next
    title: ckb-next
    command: /usr/bin/ckb-next --background
    try_exec: /usr/bin/ckb-next
  - name: io.elementary.mail
    title: Mail
    command: io.elementary.mail --background
    try_exec: io.elementary.mail
repositories:
  rpm: []
  copr: []
services:
  system: []
  user: []
fonts: []
hardware:
  packages: []
  services: []
