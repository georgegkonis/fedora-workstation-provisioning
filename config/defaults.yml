---
# Shared configuration. Maps merge recursively; lists are replaced by later layers.
features:
  desktop: true
  development: true
  work: false
  personal: true
  virtualization: false
preferences:
  shell: bash
  terminal: ptyxis
  editor: vscode
  browser: firefox
  container_engine: podman
development:
  dotnet:
  - '8.0'
  - '10.0'
  java: []
  node:
  - '22'
  python:
  - system
  containers: true
  terraform: true
  powershell: true
  typst: true
  git_credential_manager: true
  anaconda: false
  ai_clis:
  - antigravity
  - claude-code
  - codex
apps:
  onepassword: true
  vscode: true
  jetbrains: true
  podman_desktop: true
git:
  name: ''
  email: ''
  work_name: ''
  work_email: ''
  signing_key: ''
  work_signing_key: ''
work:
  azure_cli: true
packages:
  base:
  - git
  - curl
  - fastfetch
  - tree
  - zip
  - unzip
  - rclone
  - tmux
  - jq
  - bat
  - ripgrep
  - just
  desktop:
  - gnome-tweaks
  - neovim
  development:
  - make
  - gcc
  - gcc-c++
  - autoconf
  - automake
  - ccache
  - cscope
  - ctags
  - gdb
  - meson
  - ninja-build
  - strace
  - valgrind
  - python3-ansible-lint
  - gh
  - git-subtree
  work: []
  personal: []
  virtualization:
  - qemu-kvm
  - libvirt
  - virt-manager
flatpak:
  remotes:
  - name: flathub
    url: https://dl.flathub.org/repo/flathub.flatpakrepo
  # Per-user sandbox overrides, applied only when the application is selected.
  overrides:
  # Chromium/Electron claims this tray bus name; the sandbox denies it by default,
  # so the GNOME AppIndicator extension never sees the Teams tray icon.
  - application: com.github.IsmaelMartinez.teams_for_linux
    own_name: org.freedesktop.StatusNotifierItem-2-1
  applications:
    desktop:
    - org.ferdium.Ferdium
    - com.spotify.Client
    - com.mattjakeman.ExtensionManager
    - com.github.tchx84.Flatseal
    - io.missioncenter.MissionCenter
    - org.localsend.localsend_app
    - it.mijorus.gearlever
    - com.protonvpn.www
    - io.github.kolunmi.Bazaar
    - io.github.mrvladus.List
    - io.github.pwr_solaar.solaar
    - io.gitlab.metadatacleaner.metadatacleaner
    - md.obsidian.Obsidian
    - me.timschneeberger.GalaxyBudsClient
    - org.videolan.VLC
    - xyz.ketok.Speedtest
    development:
    - org.zaproxy.ZAP
    - com.getpostman.Postman
    - io.github.mfat.sshpilot
    work:
    - com.github.IsmaelMartinez.teams_for_linux
    personal:
    - com.valvesoftware.Steam
    - org.qbittorrent.qBittorrent
    - org.zotero.Zotero
    - org.gimp.GIMP
    virtualization: []
gnome:
  # Packaged by Fedora: installed system-wide through DNF.
  system_extensions:
  - package: gnome-shell-extension-caffeine
    uuid: caffeine@patapon.info
  - package: gnome-shell-extension-dash-to-dock
    uuid: dash-to-dock@micxgx.gmail.com
  - package: gnome-shell-extension-appindicator
    uuid: appindicatorsupport@rgcjonas.gmail.com
  - package: gnome-shell-extension-apps-menu
    uuid: apps-menu@gnome-shell-extensions.gcampax.github.com
  - package: gnome-shell-extension-launch-new-instance
    uuid: launch-new-instance@gnome-shell-extensions.gcampax.github.com
  - package: gnome-shell-extension-places-menu
    uuid: places-menu@gnome-shell-extensions.gcampax.github.com
  - package: gnome-shell-extension-window-list
    uuid: window-list@gnome-shell-extensions.gcampax.github.com
  - package: gnome-shell-extension-background-logo
    uuid: background-logo@fedorahosted.org
  - package: gnome-shell-extension-blur-my-shell
    uuid: blur-my-shell@aunetx
  # Not packaged: installed per user from extensions.gnome.org.
  user_extensions:
  - clipboard-indicator@tudmotu.com
  - tilingshell@ferrarodomenico.com
  - rounded-window-corners@fxgn
  - weatheroclock@CleoMenezesJr.github.io
  - dynamic-music-pill@andbal
  - docker-manager@omerfarukgungor
  - wack-lockscreen-clock@rinzler69-wastaken.github.com
  enabled_extensions:
  - appindicatorsupport@rgcjonas.gmail.com
  - blur-my-shell@aunetx
  - caffeine@patapon.info
  - clipboard-indicator@tudmotu.com
  - dash-to-dock@micxgx.gmail.com
  - docker-manager@omerfarukgungor
  - dynamic-music-pill@andbal
  - launch-new-instance@gnome-shell-extensions.gcampax.github.com
  - rounded-window-corners@fxgn
  - tilingshell@ferrarodomenico.com
  - wack-lockscreen-clock@rinzler69-wastaken.github.com
  - weatheroclock@CleoMenezesJr.github.io
  # Desktop entries written to ~/.config/autostart; try_exec skips a missing binary.
  autostart:
  - name: 1password
    title: 1Password
    command: /usr/share/1password/1password --silent
    try_exec: /usr/share/1password/1password
  - name: ckb-next
    title: ckb-next
    command: /usr/bin/ckb-next --background
    try_exec: /usr/bin/ckb-next
  - name: com.github.IsmaelMartinez.teams_for_linux
    title: Teams for Linux
    command: flatpak run com.github.IsmaelMartinez.teams_for_linux
  - name: io.elementary.mail
    title: Mail
    command: io.elementary.mail --background
    try_exec: io.elementary.mail
  - name: io.podman_desktop.PodmanDesktop
    title: Podman Desktop
    command: flatpak run io.podman_desktop.PodmanDesktop
  - name: jetbrains-toolbox
    title: JetBrains Toolbox
    command: sh -c '"$HOME/.local/bin/jetbrains-toolbox/bin/jetbrains-toolbox" --minimize'
  - name: org.localsend.localsend_app
    title: LocalSend
    command: flatpak run org.localsend.localsend_app
repositories:
  rpm: []
  copr: []
services:
  system: []
  user: []
fonts: []
hardware:
  packages: []
  services: []
