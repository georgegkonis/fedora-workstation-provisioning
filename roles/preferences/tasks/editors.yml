---
- name: Create VS Code preference directory
  ansible.builtin.file:
    path: "{{ desktop_target_home }}/.config/Code/User"
    state: directory
    owner: "{{ desktop_target_user }}"
    mode: '0755'
  become: true
  become_user: "{{ desktop_target_user }}"

- name: Install selected VS Code preferences
  ansible.builtin.copy:
    src: vscode-settings.json
    dest: "{{ desktop_target_home }}/.config/Code/User/settings.json"
    owner: "{{ desktop_target_user }}"
    mode: '0644'
    backup: true
  become: true

- name: Load captured VS Code extension list
  ansible.builtin.include_vars:
    file: "{{ role_path }}/files/vscode-extensions.yml"

- name: List installed VS Code extensions
  ansible.builtin.command:
    argv: [code, --list-extensions]
  register: personal_vscode_installed
  changed_when: false
  when: not ansible_check_mode
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"

- name: Install missing VS Code extensions
  ansible.builtin.command:
    argv: [code, --install-extension, "{{ item }}"]
  loop: "{{ personal_vscode_extensions }}"
  when:
    - not ansible_check_mode
    - item | lower not in (personal_vscode_installed.stdout_lines | default([]) | map('lower') | list)
  changed_when: true
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"

- name: Validate destination JetBrains configuration versions
  ansible.builtin.assert:
    that:
      - item.key in ['Rider', 'PyCharm', 'WebStorm', 'DataGrip']
      - item.value is match('^[0-9]{4}\.[0-9]+$')
    fail_msg: Specify an IDE name and version such as Rider and '2026.2'.
  loop: "{{ personal_jetbrains_versions | dict2items }}"

- name: Create selected JetBrains configuration directories
  ansible.builtin.file:
    path: "{{ desktop_target_home }}/.config/JetBrains/{{ item.key }}{{ item.value }}/options"
    state: directory
    owner: "{{ desktop_target_user }}"
    mode: '0755'
  loop: "{{ personal_jetbrains_versions | dict2items }}"
  become: true
  become_user: "{{ desktop_target_user }}"

- name: Install selected JetBrains editor and appearance preferences
  ansible.builtin.copy:
    src: "jetbrains/{{ item.key }}/options/"
    dest: "{{ desktop_target_home }}/.config/JetBrains/{{ item.key }}{{ item.value }}/options/"
    owner: "{{ desktop_target_user }}"
    mode: '0644'
    backup: true
  loop: "{{ personal_jetbrains_versions | dict2items }}"
  become: true
