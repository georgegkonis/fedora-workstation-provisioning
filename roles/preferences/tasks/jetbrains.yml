---

- name: Validate destination JetBrains configuration versions
  ansible.builtin.assert:
    that:
      - item.key in ['Rider', 'PyCharm', 'WebStorm', 'DataGrip']
      - item.value is match('^[0-9]{4}\.[0-9]+$')
    fail_msg: Specify an IDE name and version such as Rider and '2026.2'.
  loop: "{{ personal_jetbrains_versions | dict2items }}"

- name: Create selected JetBrains configuration directories
  ansible.builtin.file:
    path: "{{ desktop_target_home }}/.config/JetBrains/{{ item.key }}{{ item.value }}/options"
    state: directory
    owner: "{{ desktop_target_user }}"
    mode: '0755'
  loop: "{{ personal_jetbrains_versions | dict2items }}"
  become: true
  become_user: "{{ desktop_target_user }}"

- name: Install selected JetBrains editor and appearance preferences
  ansible.builtin.copy:
    src: "jetbrains/{{ item.key }}/options/"
    dest: "{{ desktop_target_home }}/.config/JetBrains/{{ item.key }}{{ item.value }}/options/"
    owner: "{{ desktop_target_user }}"
    mode: '0644'
    backup: true
  loop: "{{ personal_jetbrains_versions | dict2items }}"
  become: true
