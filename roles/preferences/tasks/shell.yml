---
- name: Ensure personal CLI tools are available in Bash
  ansible.builtin.blockinfile:
    path: "{{ desktop_target_home }}/.bashrc"
    create: true
    owner: "{{ desktop_target_user }}"
    mode: '0644'
    marker: '# {mark} ANSIBLE MANAGED PERSONAL CLI PATH'
    block: |
      case ":$PATH:" in
        *":$HOME/.local/bin:"*) ;;
        *) export PATH="$HOME/.local/bin:$PATH" ;;
      esac
  become: true
