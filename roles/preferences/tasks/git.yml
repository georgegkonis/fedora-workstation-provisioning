---
- name: Ensure Git is installed
  ansible.builtin.dnf:
    name: git
    state: present
  become: true

- name: Configure personal Git defaults
  community.general.git_config:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    scope: global
    state: present
  loop: "{{ personal_git_config | dict2items }}"
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"

- name: Configure supplied personal Git identity
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
    state: present
  loop:
    - name: user.name
      value: "{{ personal_git_name }}"
    - name: user.email
      value: "{{ personal_git_email }}"
  when: item.value | length > 0
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"
