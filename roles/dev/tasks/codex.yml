---

- name: Check if Codex CLI is installed
  ansible.builtin.command: which codex
  register: dev_codex_check
  failed_when: false
  changed_when: false
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"

- name: Install Codex CLI
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://chatgpt.com/codex/install.sh | sh
  args:
    executable: /bin/bash
  when: dev_codex_check.rc != 0
  changed_when: true
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"
