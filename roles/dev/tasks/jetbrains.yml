---
- name: Install Toolbox dependencies
  ansible.builtin.dnf:
    name:
      - fuse
      - libXi
      - libXrender
      - libXtst
      - fontconfig
      - gtk3
      - xcb-util-keysyms
      - glx-utils
    state: present
  become: true

- name: Fetch latest JetBrains Toolbox release
  ansible.builtin.uri:
    url: "https://data.services.jetbrains.com/products/releases?code=TBA&latest=true&type=release"
    return_content: true
  register: development_toolbox_api

- name: Download JetBrains Toolbox
  ansible.builtin.get_url:
    url: "{{ development_toolbox_api.json.TBA[0].downloads.linux.link }}"
    dest: /tmp/jetbrains-toolbox.tar.gz
    mode: "0644"

- name: Create JetBrains Toolbox directory
  ansible.builtin.file:
    path: "{{ desktop_target_home }}/.local/bin/jetbrains-toolbox"
    state: directory
    owner: "{{ desktop_target_user }}"
    mode: "0755"
  become: true
  become_user: "{{ desktop_target_user }}"

- name: Extract JetBrains Toolbox
  ansible.builtin.unarchive:
    src: /tmp/jetbrains-toolbox.tar.gz
    dest: "{{ desktop_target_home }}/.local/bin/jetbrains-toolbox"
    remote_src: true
    extra_opts:
      - --strip-components=1
  become: true
  become_user: "{{ desktop_target_user }}"

- name: Check if JetBrains Toolbox is already configured
  ansible.builtin.stat:
    path: "{{ desktop_target_home }}/.local/share/applications/jetbrains-toolbox.desktop"
  register: toolbox_setup_state

- name: Launch JetBrains Toolbox in the background
  ansible.builtin.command: "{{ desktop_target_home }}/.local/bin/jetbrains-toolbox/bin/jetbrains-toolbox"
  async: 10
  poll: 0
  when: not toolbox_setup_state.stat.exists
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"
