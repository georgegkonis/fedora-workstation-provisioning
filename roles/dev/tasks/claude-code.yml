---
- name: Check if Claude Code is installed
  ansible.builtin.command: which claude
  register: dev_claude_code_check
  failed_when: false
  changed_when: false
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"

- name: Install Claude Code
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
  when: dev_claude_code_check.rc != 0
  changed_when: true
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"
