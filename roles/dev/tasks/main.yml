---

- name: Configure JetBrains Toolbox
  ansible.builtin.import_tasks: jetbrains.yml

- name: Configure VS Code
  ansible.builtin.import_tasks: vscode.yml

- name: Configure .NET SDKs
  ansible.builtin.import_tasks: sdks.yml

- name: Configure development packages
  ansible.builtin.import_tasks: packages.yml

- name: Configure Azure CLI
  ansible.builtin.import_tasks: azure-cli.yml
  when: include_work_tools | bool

- name: Configure Terraform
  ansible.builtin.import_tasks: terraform.yml

- name: Configure Typst
  ansible.builtin.import_tasks: typst.yml

- name: Configure Antigravity CLI
  ansible.builtin.import_tasks: antigravity.yml

- name: Configure Claude Code CLI
  ansible.builtin.import_tasks: claude-code.yml

- name: Configure Codex CLI
  ansible.builtin.import_tasks: codex.yml
