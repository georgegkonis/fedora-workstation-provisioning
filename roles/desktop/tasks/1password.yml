---
- name: Add 1Password repository key
  ansible.builtin.rpm_key:
    state: present
    key: https://downloads.1password.com/linux/keys/1password.asc

- name: Add 1Password repository
  ansible.builtin.yum_repository:
    name: 1password
    description: 1Password Stable Channel
    baseurl: https://downloads.1password.com/linux/rpm/stable/
    enabled: true
    gpgcheck: true
    gpgkey: https://downloads.1password.com/linux/keys/1password.asc

- name: Install 1Password and CLI
  ansible.builtin.dnf:
    name:
      - 1password
      - 1password-cli
    state: present

- name: Set ptrace_scope for 1Password
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-1password-ptrace.conf
    content: "kernel.yama.ptrace_scope = 1\n"
    owner: root
    group: root
    mode: '0644'

- name: Reload sysctl to apply ptrace_scope change
  ansible.builtin.command: sysctl --system
  become: true
  changed_when: false

- name: Copy 1Password GNOME shortcut script
  ansible.builtin.copy:
    src: files/1password-gnome-shortcut.sh
    dest: /tmp/1password-gnome-shortcut.sh
    mode: '0755'

- name: Run 1Password GNOME shortcut script
  ansible.builtin.command: bash /tmp/1password-gnome-shortcut.sh
  register: desktop_shortcut_result
  changed_when: "'CHANGED' in desktop_shortcut_result.stdout"

- name: Grant Flatpak Firefox permissions to use host portal
  ansible.builtin.command: flatpak override --user --talk-name=org.freedesktop.Flatpak org.mozilla.firefox
  changed_when: false

- name: Create wrapper script and manifest directories for Firefox Flatpak
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ansible_user_dir }}/.var/app/org.mozilla.firefox/data/bin"
    - "{{ ansible_user_dir }}/.var/app/org.mozilla.firefox/.mozilla/native-messaging-hosts"

- name: Create 1Password wrapper script for Firefox Flatpak
  ansible.builtin.copy:
    dest: "{{ ansible_user_dir }}/.var/app/org.mozilla.firefox/data/bin/1password-wrapper.sh"
    mode: '0755'
    content: |
      #!/bin/bash
      flatpak-spawn --host /usr/libexec/1Password-BrowserSupport "$@"

- name: Create 1Password native messaging manifest for Firefox Flatpak
  ansible.builtin.copy:
    dest: "{{ ansible_user_dir }}/.var/app/org.mozilla.firefox/.mozilla/native-messaging-hosts/com.1password.1password.json"
    mode: '0644'
    content: |
      {
        "name": "com.1password.1password",
        "description": "1Password BrowserSupport",
        "path": "{{ ansible_user_dir }}/.var/app/org.mozilla.firefox/data/bin/1password-wrapper.sh",
        "type": "stdio",
        "allowed_extensions": [
          "{0a75d802-9aed-41e7-8daa-24c067386e82}",
          "{25fc87fa-4d31-4fee-b5c1-c32a7844c063}",
          "{d634138d-c276-4fc8-924b-40a0ea21d284}"
        ]
      }

- name: Ensure 1Password policy directory exists
  ansible.builtin.file:
    path: /etc/1password
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Authorize flatpak-session-helper in 1Password policies
  ansible.builtin.copy:
    dest: /etc/1password/custom_allowed_browsers
    content: "flatpak-session-helper\n"
    owner: root
    group: root
    mode: '0644'
  become: true