---
- name: Configure Fedora workstation
  hosts: localhost
  connection: local
  vars_files:
    - vars/catalog.yml

  pre_tasks:
    - name: Load validated workstation configuration
      ansible.builtin.import_tasks: tasks/configuration.yml
      tags: [always, profile_check]

    - name: Resolve the desktop account
      ansible.builtin.import_tasks: tasks/user_context.yml
      tags: always

    # Opt-in: skipped unless the upgrade tag is requested (bootstrap --upgrade or just update).
    - name: Upgrade installed RPMs and system Flatpaks
      ansible.builtin.import_tasks: tasks/upgrade.yml
      tags: [upgrade, never]

  roles:
    - role: base
      tags: base
    - role: repositories
      tags: [repositories, packages, applications, base, desktop, development, work, personal, virtualization,
             vscode, onepassword, docker, terraform, powershell, azure_cli]
    - role: packages
    - role: flatpak
      tags: [flatpak, applications]
    - role: applications
      tags: applications
    - role: development
      when: workstation.features.development
      tags: development
    - role: gnome
      when: workstation.features.desktop
      tags: gnome
    - role: services
      tags: [services, containers, docker, virtualization, hardware]

  post_tasks:
    - name: Summarize optional components requiring attention
      ansible.builtin.debug:
        msg: "GNOME extension warnings: {{ gnome_extension_failures | default([]) }}"
      when: gnome_extension_failures | default([]) | length > 0
      tags: always
