---
- name: Collect installed RPM packages
  ansible.builtin.package_facts:
    manager: rpm

- name: Build expected user paths and CLIs from enabled selections
  ansible.builtin.set_fact:
    verify_expected_paths: >-
      {{ [desktop_personal_projects_path]
         + ([desktop_work_projects_path] if workstation.features.work else [])
         + ([desktop_target_home + '/.local/share/icons/MoreWaita'] if workstation.features.desktop else [])
         + (workstation.gnome.autostart | map(attribute='name')
            | map('regex_replace', '^', desktop_target_home + '/.config/autostart/')
            | map('regex_replace', '$', '.desktop') | list
            if workstation.features.desktop else [])
         + ([desktop_target_home + '/.local/bin/jetbrains-toolbox/bin/jetbrains-toolbox']
            if workstation.features.desktop and workstation.features.development and workstation.apps.jetbrains else [])
         + ([desktop_target_home + '/.local/bin/git-credential-manager']
            if workstation.features.development and workstation.development.git_credential_manager else [])
         + ([desktop_target_home + '/.local/bin/typst']
            if workstation.features.development and workstation.development.typst else [])
         + ([desktop_target_home + '/anaconda3/bin/conda']
            if workstation.features.development and workstation.development.anaconda else []) }}
    verify_expected_clis: >-
      {{ (workstation.development.ai_clis | map('regex_replace', '^antigravity$', 'agy') | list)
         if workstation.features.development else [] }}

- name: List installed system Flatpaks
  ansible.builtin.command:
    argv: [flatpak, list, --system, --app, --columns=application]
  register: verify_installed_flatpaks
  failed_when: false
  changed_when: false
  check_mode: false
  when: workstation.selected.flatpaks | length > 0

- name: Check declared user installation paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ verify_expected_paths }}"
  register: verify_user_paths

- name: Check selected user-installed CLIs
  ansible.builtin.command:
    argv: [which, "{{ item }}"]
  loop: "{{ verify_expected_clis }}"
  register: verify_cli_tools
  failed_when: false
  changed_when: false
  check_mode: false
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"

- name: Compare selected software with installed state
  ansible.builtin.set_fact:
    verify_missing_rpms: "{{ workstation.selected.expected_rpms | difference(ansible_facts.packages.keys() | list) }}"
    verify_missing_flatpaks: "{{ workstation.selected.flatpaks | difference(verify_installed_flatpaks.stdout_lines | default([])) }}"
    verify_missing_paths: "{{ verify_user_paths.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
    verify_missing_clis: "{{ verify_cli_tools.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"

- name: Require selected workstation software
  ansible.builtin.assert:
    that:
      - verify_missing_rpms | length == 0
      - verify_missing_flatpaks | length == 0
      - verify_missing_paths | length == 0
      - verify_missing_clis | length == 0
    fail_msg: |
      Missing RPMs: {{ verify_missing_rpms | join(', ') }}
      Missing Flatpaks: {{ verify_missing_flatpaks | join(', ') }}
      Missing paths: {{ verify_missing_paths | join(', ') }}
      Missing CLIs: {{ verify_missing_clis | join(', ') }}
      User dotfile contents are checked separately by chezmoi verify.

- name: Verify declared system services
  ansible.builtin.include_tasks: verify-service.yml
  loop: "{{ workstation.selected.system_services }}"
  loop_control:
    loop_var: verify_service
  vars:
    verify_service_scope: system

- name: Verify declared user services
  ansible.builtin.include_tasks: verify-service.yml
  loop: "{{ workstation.services.user }}"
  loop_control:
    loop_var: verify_service
  vars:
    verify_service_scope: user
