---
- name: Validate profile structure
  ansible.builtin.assert:
    that:
      - profile is mapping
      - profile.work_machine is boolean
      - profile.install_anaconda is boolean
      - profile.toolchains is mapping
      - profile.toolchains.dotnet is sequence and profile.toolchains.dotnet is not string
      - profile.toolchains.java is sequence and profile.toolchains.java is not string
      - profile.toolchains.node is sequence and profile.toolchains.node is not string
      - profile.toolchains.python is sequence and profile.toolchains.python is not string
      - profile.git is mapping
      - profile.jetbrains_versions is mapping
      - profile.obsidian_vaults is sequence and profile.obsidian_vaults is not string
    fail_msg: Edit profile.local.yml using the documented work flag, toolchain lists, and preferences.

- name: Validate toolchain version strings
  ansible.builtin.assert:
    that:
      - profile.toolchains.dotnet | select('match', '^[0-9]+\\.[0-9]+$') | list | length == profile.toolchains.dotnet | length
      - profile.toolchains.java | select('match', '^[0-9]+$') | list | length == profile.toolchains.java | length
      - profile.toolchains.node | select('match', '^[0-9]+$') | list | length == profile.toolchains.node | length
      - profile.toolchains.python | select('match', '^(system|[0-9]+\\.[0-9]+)$') | list | length == profile.toolchains.python | length
    fail_msg: Use quoted versions such as '8.0', '21', '22', or '3.13'.

- name: Require personal and work Git identities on work machines
  ansible.builtin.assert:
    that:
      - profile.git.name | default('') | length > 0
      - profile.git.email | default('') | length > 0
      - profile.git.work_name | default('') | length > 0
      - profile.git.work_email | default('') | length > 0
    fail_msg: Set git.name, git.email, git.work_name, and git.work_email in profile.local.yml for a work machine.
  when: profile.work_machine | bool

- name: Validate the pinned Anaconda installer
  ansible.builtin.assert:
    that:
      - provision_anaconda_release is match('^[0-9]{4}\\.[0-9]{2}-[0-9]+$')
      - provision_anaconda_sha256.x86_64 is match('^[0-9a-f]{64}$')
      - provision_anaconda_sha256.aarch64 is match('^[0-9a-f]{64}$')
    fail_msg: The Anaconda release and checksums in vars/catalog.yml are invalid.
  when: profile.install_anaconda | bool
