---
- name: Install the Fedora Python runtime and pip
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
    state: present
  become: true
  when: "'system' in profile.toolchains.python"

- name: Install selected additional Fedora Python runtimes
  ansible.builtin.dnf:
    name: "python{{ item }}"
    state: present
  loop: "{{ profile.toolchains.python | reject('equalto', 'system') | list }}"
  become: true
