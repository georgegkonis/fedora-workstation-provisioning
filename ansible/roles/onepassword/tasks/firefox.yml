---

- name: Grant Flatpak Firefox permissions to use host portal
  ansible.builtin.command: flatpak override --user --talk-name=org.freedesktop.Flatpak org.mozilla.firefox
  changed_when: false
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"

- name: Create wrapper script and manifest directories for Firefox Flatpak
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ desktop_target_user }}"
  loop:
    - "{{ desktop_target_home }}/.var/app/org.mozilla.firefox/data/bin"
    - "{{ desktop_target_home }}/.var/app/org.mozilla.firefox/.mozilla/native-messaging-hosts"
  become: true

- name: Create 1Password wrapper script for Firefox Flatpak
  ansible.builtin.copy:
    owner: "{{ desktop_target_user }}"
    dest: "{{ desktop_target_home }}/.var/app/org.mozilla.firefox/data/bin/1password-wrapper.sh"
    mode: '0755'
    content: |
      #!/bin/bash
      flatpak-spawn --host /usr/libexec/1Password-BrowserSupport "$@"
  become: true

- name: Create 1Password native messaging manifest for Firefox Flatpak
  ansible.builtin.copy:
    owner: "{{ desktop_target_user }}"
    dest: "{{ desktop_target_home }}/.var/app/org.mozilla.firefox/.mozilla/native-messaging-hosts/com.1password.1password.json"
    mode: '0644'
    content: |
      {
        "name": "com.1password.1password",
        "description": "1Password BrowserSupport",
        "path": "{{ desktop_target_home }}/.var/app/org.mozilla.firefox/data/bin/1password-wrapper.sh",
        "type": "stdio",
        "allowed_extensions": [
          "{0a75d802-9aed-41e7-8daa-24c067386e82}",
          "{25fc87fa-4d31-4fee-b5c1-c32a7844c063}",
          "{d634138d-c276-4fc8-924b-40a0ea21d284}"
        ]
      }
  become: true

- name: Ensure 1Password policy directory exists
  ansible.builtin.file:
    path: /etc/1password
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Authorize flatpak-session-helper in 1Password policies
  ansible.builtin.copy:
    dest: /etc/1password/custom_allowed_browsers
    content: "flatpak-session-helper\n"
    owner: root
    group: root
    mode: '0644'
  become: true
