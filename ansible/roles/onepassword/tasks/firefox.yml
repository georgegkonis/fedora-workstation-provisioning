---
- name: Read Firefox user Flatpak overrides
  ansible.builtin.command:
    argv: [flatpak, override, --user, --show, org.mozilla.firefox]
  register: onepassword_firefox_overrides
  changed_when: false
  check_mode: false
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"

- name: Allow Firefox to use the host native-messaging portal
  ansible.builtin.command:
    argv: [flatpak, override, --user, --talk-name=org.freedesktop.Flatpak, org.mozilla.firefox]
  when: "'org.freedesktop.Flatpak=talk' not in onepassword_firefox_overrides.stdout"
  changed_when: true
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"

- name: Ensure 1Password policy directory exists
  ansible.builtin.file:
    path: /etc/1password
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Authorize flatpak-session-helper in 1Password policies
  ansible.builtin.lineinfile:
    path: /etc/1password/custom_allowed_browsers
    line: flatpak-session-helper
    create: true
    owner: root
    group: root
    mode: '0644'
  become: true
