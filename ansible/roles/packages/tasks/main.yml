---
- name: Install common and feature packages
  ansible.builtin.import_tasks: common.yml
  tags: packages

- name: Install selected application packages
  ansible.builtin.include_tasks:
    file: applications.yml
    apply:
      tags:
        - packages
        - applications
        - "{{ packages_app.key }}"
        - "{{ packages_app.feature }}"
  loop: "{{ workstation.selected.rpm_apps }}"
  loop_control:
    loop_var: packages_app
    label: "{{ packages_app.name }}"
  tags: always

- name: Install hardware packages
  ansible.builtin.import_tasks: hardware.yml
  tags: hardware

- name: Install fonts
  ansible.builtin.import_tasks: fonts.yml
  tags: packages

- name: Configure login shell
  ansible.builtin.import_tasks: shell.yml
  tags: packages
