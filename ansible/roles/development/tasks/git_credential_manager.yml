---
- name: Validate the declared Git Credential Manager release
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['x86_64', 'aarch64']
      - provision_gcm_sha256[ansible_architecture] is match('^[0-9a-f]{64}$')
    fail_msg: Git Credential Manager supports x86_64 and aarch64 with a checksum in ansible/vars/catalog.yml.

- name: Create Git Credential Manager and user binary directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ desktop_target_user }}"
    mode: '0755'
  loop:
    - "{{ desktop_target_home }}/.local/bin"
    - "{{ desktop_target_home }}/.local/share/git-credential-manager/{{ provision_gcm_version }}"
  become: true

- name: Check extracted Git Credential Manager release
  ansible.builtin.stat:
    path: "{{ desktop_target_home }}/.local/share/git-credential-manager/{{ provision_gcm_version }}/git-credential-manager"
  register: development_gcm_binary

- name: Download the pinned Git Credential Manager release
  ansible.builtin.get_url:
    url: >-
      https://github.com/git-ecosystem/git-credential-manager/releases/download/v{{ provision_gcm_version }}/gcm-linux-{{
      'x64' if ansible_architecture == 'x86_64' else 'arm64' }}-{{ provision_gcm_version }}.tar.gz
    dest: "/tmp/gcm-{{ provision_gcm_version }}-{{ ansible_architecture }}.tar.gz"
    checksum: "sha256:{{ provision_gcm_sha256[ansible_architecture] }}"
    mode: '0644'
  when: not development_gcm_binary.stat.exists and not ansible_check_mode

- name: Extract Git Credential Manager release
  ansible.builtin.unarchive:
    src: "/tmp/gcm-{{ provision_gcm_version }}-{{ ansible_architecture }}.tar.gz"
    dest: "{{ desktop_target_home }}/.local/share/git-credential-manager/{{ provision_gcm_version }}"
    remote_src: true
    creates: "{{ desktop_target_home }}/.local/share/git-credential-manager/{{ provision_gcm_version }}/git-credential-manager"
  become: true
  become_user: "{{ desktop_target_user }}"
  when: not development_gcm_binary.stat.exists and not ansible_check_mode

- name: Link Git Credential Manager into the user binary directory
  ansible.builtin.file:
    src: "{{ desktop_target_home }}/.local/share/git-credential-manager/{{ provision_gcm_version }}/git-credential-manager"
    dest: "{{ desktop_target_home }}/.local/bin/git-credential-manager"
    state: link
    force: true
  become: true
  become_user: "{{ desktop_target_user }}"
  when: development_gcm_binary.stat.exists or not ansible_check_mode
