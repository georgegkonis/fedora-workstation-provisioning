---
- name: Ensure Git is installed for Obsidian synchronization
  ansible.builtin.dnf:
    name: git
    state: present
  become: true

- name: Ensure the Obsidian vault directory exists
  ansible.builtin.file:
    path: "{{ desktop_target_home }}/Documents/Obsidian"
    state: directory
    mode: '0755'
  become: true
  become_user: "{{ desktop_target_user }}"

- name: Validate configured Obsidian vault repositories
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name | length > 0
      - item.name is not match('.*[/\\].*')
      - item.repo is defined
      - item.repo | length > 0
    fail_msg: Each workstation.obsidian_vaults entry needs a folder name and Git repository URL.
  loop: "{{ workstation.obsidian_vaults }}"

- name: Clone configured Obsidian vault repositories
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ desktop_target_home }}/Documents/Obsidian/{{ item.name }}"
    version: "{{ item.version | default('HEAD') }}"
    update: false
  loop: "{{ workstation.obsidian_vaults }}"
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"
