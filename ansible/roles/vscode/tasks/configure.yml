---

- name: Create VS Code preference directory
  ansible.builtin.file:
    path: "{{ desktop_target_home }}/.config/Code/User"
    state: directory
    owner: "{{ desktop_target_user }}"
    mode: '0755'
  become: true
  become_user: "{{ desktop_target_user }}"

- name: Install selected VS Code preferences
  ansible.builtin.copy:
    src: vscode-settings.json
    dest: "{{ desktop_target_home }}/.config/Code/User/settings.json"
    owner: "{{ desktop_target_user }}"
    mode: '0644'
    backup: true
  become: true

- name: List installed VS Code extensions
  ansible.builtin.command:
    argv: [code, --list-extensions]
  register: vscode_installed_extensions
  changed_when: false
  when: not ansible_check_mode
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"

- name: Install missing VS Code extensions
  ansible.builtin.command:
    argv: [code, --install-extension, "{{ item }}"]
  loop: "{{ provision_vscode_extensions }}"
  when:
    - not ansible_check_mode
    - item | lower not in (vscode_installed_extensions.stdout_lines | default([]) | map('lower') | list)
  changed_when: true
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"

- name: Install work VS Code extensions
  ansible.builtin.command:
    argv: [code, --install-extension, "{{ item }}"]
  loop: "{{ provision_work_vscode_extensions }}"
  when:
    - profile.work_machine | bool
    - not ansible_check_mode
    - item | lower not in (vscode_installed_extensions.stdout_lines | default([]) | map('lower') | list)
  changed_when: true
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"
