- key: /org/gnome/shell/extensions/weather-oclock/weather-after-clock
  value: 'true'
  description: Show the weather after the clock
- key: /org/gnome/shell/extensions/wack-lockscreen-clock/lockscreen-mode
  value: '''cupertino'''
  description: Use the Cupertino lock screen clock
- key: /org/gnome/shell/extensions/wack-lockscreen-clock/date-style
  value: '''full'''
  description: Show the full date on the lock screen clock
- key: /org/gnome/shell/extensions/appindicator/tray-pos
  value: '''left'''
  description: Place tray icons on the left of the panel
- key: /org/gnome/shell/extensions/rounded-window-corners-reborn/blacklist
  value: '[''jetbrains-rider'', ''jetbrains-pycharm'', ''jetbrains-webstorm'', ''jetbrains-datagrip'']'
  description: Skip rounded corners for JetBrains IDEs
- key: /org/gnome/shell/extensions/rounded-window-corners-reborn/border-width
  value: '1'
  description: Use a one-pixel window border
