  value: 'false'
  description: Use dynamic blur on the dock
- key: /org/gnome/shell/extensions/blur-my-shell/dash-to-dock/unblur-in-overview
  value: 'true'
  description: Remove dock blur in the overview
- key: /org/gnome/shell/extensions/blur-my-shell/popup/pipeline
  value: '''pipeline_default_rounded'''
  description: Use the rounded blur pipeline for popups
