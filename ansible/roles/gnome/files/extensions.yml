---
gnome_extensions_settings:
- key: /org/gnome/shell/extensions/dash-to-dock/dock-position
  value: '''BOTTOM'''
  description: Place the dock at the bottom
- key: /org/gnome/shell/extensions/dash-to-dock/click-action
  value: '''minimize-or-overview'''
  description: Minimize or show overview on dock click
- key: /org/gnome/shell/extensions/dash-to-dock/scroll-action
  value: '''cycle-windows'''
  description: Cycle windows with dock scrolling
- key: /org/gnome/shell/extensions/clipboard-indicator/toggle-menu
  value: '[''<Super>v'']'
  description: Open clipboard history with Super+V
- key: /org/gnome/shell/extensions/tilingshell/inner-gaps
  value: uint32 5
  description: Use five-pixel inner tiling gaps
- key: /org/gnome/shell/extensions/tilingshell/outer-gaps
  value: uint32 5
  description: Use five-pixel outer tiling gaps
- key: /org/gnome/shell/extensions/dash-to-dock/background-opacity
  value: '0.8'
  description: Use 80% dock background opacity
- key: /org/gnome/shell/extensions/dash-to-dock/dash-max-icon-size
  value: '46'
  description: Cap dock icons at 46 pixels
- key: /org/gnome/shell/extensions/dash-to-dock/height-fraction
  value: '0.9'
  description: Use 90% of the screen for the dock
- key: /org/gnome/shell/extensions/dash-to-dock/hot-keys
  value: 'true'
  description: Enable Super+number dock shortcuts
- key: /org/gnome/shell/extensions/clipboard-indicator/display-mode
  value: '3'
  description: Show only the clipboard icon in the panel
- key: /org/gnome/shell/extensions/clipboard-indicator/open-at-cursor
  value: 'true'
  description: Open clipboard history at the cursor
- key: /org/gnome/shell/extensions/clipboard-indicator/paste-on-select
  value: 'true'
  description: Paste immediately when a history entry is selected
- key: /org/gnome/shell/extensions/clipboard-indicator/move-item-first
  value: 'true'
  description: Move reused clipboard entries to the top
- key: /org/gnome/shell/extensions/clipboard-indicator/show-search-bar
  value: 'true'
  description: Show the clipboard history search bar
- key: /org/gnome/shell/extensions/tilingshell/enable-snap-assist
  value: 'false'
  description: Disable the tiling snap assistant
- key: /org/gnome/shell/extensions/tilingshell/enable-autotiling
  value: 'false'
  description: Disable automatic tiling
- key: /org/gnome/shell/extensions/tilingshell/show-indicator
  value: 'true'
  description: Show the tiling layout indicator in the panel
- key: /org/gnome/shell/extensions/tilingshell/top-edge-maximize
  value: 'true'
  description: Maximize windows dragged to the top edge
