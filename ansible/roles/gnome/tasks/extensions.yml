---
- name: Read GNOME Shell version
  ansible.builtin.command: gnome-shell --version
  register: gnome_shell_version_result
  changed_when: false
  check_mode: false

- name: Install system GNOME extensions from DNF
  ansible.builtin.dnf:
    name: "{{ workstation.gnome.system_extensions | map(attribute='package') | list }}"
    state: present
  become: true
  when: workstation.gnome.system_extensions | length > 0

# Blur my Shell needs gnome-rounded-blur for rounded dynamic blur (Fedora 44 route in
# https://github.com/aunetx/blur-my-shell/blob/master/scripts/GUIDE.md). The COPR is kept
# disabled so it cannot override main-repo packages; it is enabled for this install only.
- name: Enable ublue-os COPR for gnome-rounded-blur
  community.general.copr:
    name: ublue-os/packages
    state: enabled
  become: true
  when: "'blur-my-shell@aunetx' in workstation.gnome.enabled_extensions"

- name: Disable ublue-os COPR globally
  ansible.builtin.command: dnf config-manager setopt copr:copr.fedorainfracloud.org:ublue-os:packages.enabled=0
  changed_when: false
  check_mode: false
  become: true
  when: "'blur-my-shell@aunetx' in workstation.gnome.enabled_extensions"

- name: Install gnome-rounded-blur for Blur my Shell
  ansible.builtin.dnf:
    name: gnome-rounded-blur
    enablerepo: copr:copr.fedorainfracloud.org:ublue-os:packages
    state: present
  become: true
  when: "'blur-my-shell@aunetx' in workstation.gnome.enabled_extensions"

- name: Initialize extension installation results
  ansible.builtin.set_fact:
    gnome_system_extension_uuids: "{{ workstation.gnome.system_extensions | map(attribute='uuid') | list }}"
    gnome_shell_major: "{{ gnome_shell_version_result.stdout | regex_search('[0-9]+') }}"
    gnome_available_extensions: []
    gnome_extension_failures: []

- name: Install compatible optional user GNOME extensions
  ansible.builtin.include_tasks: extension.yml
  loop: "{{ workstation.gnome.user_extensions }}"
  loop_control:
    loop_var: gnome_extension_uuid
  when: not ansible_check_mode

- name: Explain GNOME extension check-mode limitation
  ansible.builtin.debug:
    msg: Extension download and compatibility checks are skipped in check mode.
  when: ansible_check_mode

- name: Read currently enabled GNOME extensions
  ansible.builtin.command: dconf read /org/gnome/shell/enabled-extensions
  register: gnome_current_extensions
  changed_when: false
  check_mode: false
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"

- name: Enable declared compatible extensions and preserve unmanaged extensions
  community.general.dconf:
    key: /org/gnome/shell/enabled-extensions
    value: >-
      {{ '@as ' + (((gnome_current_extensions.stdout | regex_replace('^@as\s+', '')
                     | default('[]', true) | from_yaml)
                   | difference((gnome_system_extension_uuids + workstation.gnome.user_extensions)
                                | difference(workstation.gnome.enabled_extensions))
                   + (workstation.gnome.enabled_extensions
                      | intersect(gnome_system_extension_uuids + gnome_available_extensions)))
                  | unique | sort | to_json) }}
    state: present
  when: not ansible_check_mode
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"

- name: Summarize optional extension failures
  ansible.builtin.debug:
    msg: "Optional GNOME extensions need attention: {{ gnome_extension_failures }}"
  when: gnome_extension_failures | length > 0
