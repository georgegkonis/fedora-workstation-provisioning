---

- name: Create user icon theme directory
  ansible.builtin.file:
    path: "{{ desktop_target_home }}/.local/share/icons"
    state: directory
    owner: "{{ desktop_target_user }}"
    mode: '0755'
  become: true

- name: Ensure Git is available for the icon theme
  ansible.builtin.dnf:
    name: git
    state: present
  become: true

- name: Install the source laptop's MoreWaita icon theme revision
  ansible.builtin.git:
    repo: https://github.com/somepaulo/MoreWaita.git
    dest: "{{ desktop_target_home }}/.local/share/icons/MoreWaita"
    version: "{{ provision_morewaita_revision }}"
    update: false
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"
