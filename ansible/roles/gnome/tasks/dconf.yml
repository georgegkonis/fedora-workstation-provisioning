---

- name: Load intentionally managed GNOME settings
  ansible.builtin.include_vars:
    dir: "{{ role_path }}/files"
    extensions: [yml]

- name: Apply named GNOME preferences
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ gnome_interface_settings + gnome_keyboard_settings + gnome_input_settings + gnome_extensions_settings }}"
  loop_control:
    label: "{{ item.description }}"
  become: true
  become_user: "{{ desktop_target_user }}"
  environment: "{{ desktop_user_env }}"
