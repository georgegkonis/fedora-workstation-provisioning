---
- name: Ensure Flatpak is installed when applications are selected
  ansible.builtin.dnf:
    name: flatpak
    state: present
  become: true
  when: workstation.selected.flatpaks | length > 0
  tags: [base, desktop, development, work, personal, virtualization]

- name: Configure declared Flatpak remotes
  community.general.flatpak_remote:
    name: "{{ item.name }}"
    flatpakrepo_url: "{{ item.url }}"
    method: system
    state: present
  loop: "{{ workstation.flatpak.remotes }}"
  become: true
  when: workstation.selected.flatpaks | length > 0
  tags: [base, desktop, development, work, personal, virtualization]

- name: Install base Flatpaks
  ansible.builtin.import_tasks: applications.yml
  vars:
    selected_flatpaks: "{{ workstation.selected.flatpaks_by_feature.base }}"
  tags: base

- name: Install desktop Flatpaks
  ansible.builtin.import_tasks: applications.yml
  vars:
    selected_flatpaks: "{{ workstation.selected.flatpaks_by_feature.desktop }}"
  when: workstation.features.desktop
  tags: desktop

- name: Install development Flatpaks
  ansible.builtin.import_tasks: applications.yml
  vars:
    selected_flatpaks: "{{ workstation.selected.flatpaks_by_feature.development }}"
  when: workstation.features.development
  tags: development

- name: Install work Flatpaks
  ansible.builtin.import_tasks: applications.yml
  vars:
    selected_flatpaks: "{{ workstation.selected.flatpaks_by_feature.work }}"
  when: workstation.features.work
  tags: work

- name: Install personal Flatpaks
  ansible.builtin.import_tasks: applications.yml
  vars:
    selected_flatpaks: "{{ workstation.selected.flatpaks_by_feature.personal }}"
  when: workstation.features.personal
  tags: personal

- name: Install virtualization Flatpaks
  ansible.builtin.import_tasks: applications.yml
  vars:
    selected_flatpaks: "{{ workstation.selected.flatpaks_by_feature.virtualization }}"
  when: workstation.features.virtualization
  tags: virtualization

- name: Apply per-user Flatpak sandbox overrides
  community.general.ini_file:
    path: "{{ desktop_target_home }}/.local/share/flatpak/overrides/{{ item.application }}"
    section: Session Bus Policy
    option: "{{ item.own_name }}"
    value: own
    no_extra_spaces: true
    mode: "0644"
  loop: "{{ workstation.selected.flatpak_overrides }}"
  become: true
  become_user: "{{ desktop_target_user }}"
  tags: [base, desktop, development, work, personal, virtualization]

- name: Configure per-user Flatpak background permissions
  ansible.builtin.include_tasks: background.yml
  loop: "{{ workstation.selected.flatpak_background }}"
  loop_control:
    loop_var: flatpak_background_app
    label: "{{ flatpak_background_app.application }}"
  tags: [base, desktop, development, work, personal, virtualization, flatpak_background]
